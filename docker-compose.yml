version: '3.3'

services:
  backend:
    build: ./backend
    container_name: conferencia-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: conferencia-frontend
    ports:
      # Porta do host. Padrão 8080 porque no servidor de deploy a 80 é ocupada
      # por outro serviço (Zabbix).
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
